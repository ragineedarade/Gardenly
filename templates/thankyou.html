<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .thank-you-container {
        max-width: 500px;
        padding: 40px;
        background-color: white;
        border-radius: 15px;
        border: 2px solid #28a745; /* Border for box */
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15); /* Enhanced shadow */
        text-align: center;
      }
      .thank-you-header {
        font-size: 2.5rem;
        color: #28a745; /* Success color */
      }
      .thank-you-message {
        font-size: 1.25rem;
        margin-bottom: 20px;
        color: #6c757d;
      }
      .btn-home {
        background-color: #28a745;
        border: none;
        padding: 10px 20px;
        font-size: 1.1rem;
      }
      .btn-home:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="thank-you-container">
      <h1 class="thank-you-header">Thank You!</h1>
      <p class="thank-you-message">
        Your submission has been received. We appreciate your time and effort.
      </p>
      <a href="/" class="btn btn-home text-white">Go Back to Home</a>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
