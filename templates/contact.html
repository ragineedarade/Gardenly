<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="footer.css" />
    <style>
      body {
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");
        font-family: Arial, sans-serif;
        background-color: rgb(38, 36, 36);
      }
      .contact-form {
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        max-width: 600px;
      }
      .contact-info {
        margin-bottom: 20px;
      }
      .contact-info h2 {
        color: #007bff;
        font-weight: bold;
        margin-bottom: 10px;
      }
      .form-control:focus {
        box-shadow: none;
      }
      .navbar-brand {
        font-size: 40px;
      }
      .home-icon {
        color: black;
        font-size: 25px;
      }
      .navbar-brand {
        font-size: 1.5rem;
        font-weight: bold;
      }

      .navbar {
        background-color: #343a40;
      }

      .navbar-brand {
        font-weight: bold;
        color: #4caf50 !important; /* Bright green for brand visibility */
      }

      .navbar-nav .nav-link {
        color: #e0e0e0;
      }

      .navbar-nav .nav-link.active {
        background-color: #4caf50;
        color: #1e1e1e !important;
      }

      .navbar-nav .nav-link:hover {
        background-color: #007bff;
        color: #fff;
      }
      .footer {
        padding: 40px 20px;
        background-color: rgb(30, 30, 30);
      }

      .footer h3 {
        font-weight: bold;
        margin-bottom: 20px;
        color: white;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <i class="fa-brands fa-pagelines"></i> Gardenly
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about-us">About</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                href="https://zora-virtual-assistance.netlify.app/"
                >Virtual Assistant</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact-us">Contact</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <section class="container my-5">
      <div class="contact-form">
        <div class="contact-info text-center">
          <h2>Contact Us</h2>
          <p>
            Have any questions? We'd love to hear from you! Get in touch with us
            by filling out the form below.
          </p>
        </div>
        <form action=" {% url 'savecontact' %}" method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              placeholder="Your Name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Your Email"
              required
            />
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input
              type="text"
              class="form-control"
              id="subject"
              name="subject"
              placeholder="Subject"
              required
            />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="5"
              placeholder="Write your message here..."
              required
            ></textarea>
          </div>
          <button type="submit" href="/about-us" class="btn btn-primary w-100">
            Send Message
          </button>
        </form>
      </div>
      {% include 'footer.html'%} {% include "chatbot.html" %}
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
